<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Luxury Obsidian Carbon -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#181a24"/>
      <stop offset="50%" stopColor="#0f1118"/>
      <stop offset="100%" stopColor="#07080c"/>
    </linearGradient>

    <!-- Squash Yellow Vibrant Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF275"/>
      <stop offset="35%" stopColor="#F5C200"/>
      <stop offset="100%" stopColor="#D99B00"/>
    </linearGradient>

    <!-- Metallic Platinum Text Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="70%" stopColor="#F0F2F5"/>
      <stop offset="100%" stopColor="#C9CED6"/>
    </linearGradient>

    <!-- Squash Ball 3D Radial Glow -->
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="50%" stopColor="#E2E6EC"/>
      <stop offset="100%" stopColor="#8A929E"/>
    </radialGradient>

    <!-- Outer Gold Ring Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded App Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Sleek Outer Gold Accent Rim -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.85"/>
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Dynamic Aerodynamic Speed Arc -->
  <path d="M 120 180 C 200 90, 340 100, 395 190" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 160 160 C 230 95, 330 115, 385 185" fill="none" stroke="#FFF275" stroke-width="6" stroke-linecap="round"/>

  <!-- 3D Official Double-Yellow Dot Squash Ball -->
  <g transform="translate(370, 160)">
    <circle cx="28" cy="28" r="32" fill="url(#ballGrad)"/>
    <circle cx="28" cy="28" r="31" fill="none" stroke="#606670" stroke-width="2"/>
    <!-- Double Yellow Dots -->
    <circle cx="21" cy="24" r="5" fill="#F5C200"/>
    <circle cx="35" cy="28" r="5" fill="#F5C200"/>
  </g>

  <!-- Central Bold MAKS Typography -->
  <g transform="translate(256, 310)" text-anchor="middle">
    <text font-family="'Chivo', 'Impact', 'Arial Black', sans-serif" font-size="124" font-weight="900" font-style="italic" fill="url(#silverGrad)" letter-spacing="4">
      MAKS
    </text>
  </g>

  <!-- Subtitle Ribbon: SQUASH CLUB -->
  <g transform="translate(256, 375)" text-anchor="middle">
    <!-- Underline decorative lines -->
    <line x1="-190" y1="-8" x2="-115" y2="-8" stroke="#F5C200" stroke-width="4" stroke-linecap="round"/>
    <line x1="115" y1="-8" x2="190" y2="-8" stroke="#F5C200" stroke-width="4" stroke-linecap="round"/>

    <text font-family="'Chivo', 'Arial Black', sans-serif" font-size="28" font-weight="900" font-style="italic" fill="#F5C200" letter-spacing="8">
      SQUASH
    </text>
  </g>
</svg>
